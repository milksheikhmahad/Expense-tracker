name: Deploy

# Every push to main:
#   1. builds the backend image and pushes it to GitHub Container Registry
#   2. logs in to Azure with OIDC (no stored password) and rolls the API
#      and worker Container Apps to the new image
#   3. builds the React app and uploads it to Azure Static Web Apps
# Steps 2–3 are skipped until the repo variables from `terraform output`
# are added (see SETUP.md), so the very first push only publishes the image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  deploy-backend:
    needs: image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll API and worker to the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          IMAGE="${{ needs.image.outputs.image }}:${{ github.sha }}"
          az containerapp update -n "${{ vars.API_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --image "$IMAGE" -o none
          az containerapp update -n "${{ vars.WORKER_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --image "$IMAGE" -o none
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.VITE_API_URL }}/health"; then exit 0; fi
            echo "waiting for API (cold start)…"; sleep 10
          done
          exit 1

  deploy-frontend:
    needs: test
    if: vars.VITE_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
